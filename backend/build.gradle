plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.13'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
	id 'com.google.cloud.tools.jib' version '3.4.1'
	id 'org.springdoc.openapi-gradle-plugin' version '1.9.0'
	id 'org.openapi.generator' version '7.21.0'
}

group = 'com.veritas'
version = '0.0.1'
description = 'backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	all {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'net.datafaker:datafaker:2.2.2'
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	testImplementation 'org.assertj:assertj-core:3.27.7'
	testImplementation 'org.mockito:mockito-junit-jupiter:5.7.0'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	runtimeOnly 'org.postgresql:postgresql'

	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	implementation 'org.apache.pdfbox:pdfbox:3.0.7'
	implementation 'org.springframework.boot:spring-boot-starter-log4j2'
	implementation 'org.camunda.bpm.model:camunda-bpmn-model:7.20.0'

	runtimeOnly 'com.h2database:h2'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.wiremock.integrations:wiremock-spring-boot:3.1.0'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

openApi {
	apiDocsUrl = "http://localhost:8080/api/v1/api.json"
	outputDir = file("$projectDir/../frontend")
	outputFileName = "openapi.json"
	waitTimeInSeconds = 60
	customBootRun {
		args = ["--spring.profiles.active=openapi"]
	}
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	testLogging {
		events "passed", "skipped", "failed"
		showStandardStreams = true
		exceptionFormat = "full"
	}
}

tasks.named('test') {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn(tasks.named('test'))
	reports {
		xml.required = true
		html.required = true
	}
	classDirectories.setFrom(files(classDirectories.files.collect {
		fileTree(dir: it, exclude: [
			'**/com/veritas/backend/seeding/**'
		])
	}))
}

tasks.register('unitTest', Test) {
	group = 'verification'
	description = 'Runs only unit tests'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/*UnitTest.class'
	exclude '**/*IntegrationTest.class', '**/*IT.class'
}

tasks.register('integrationTest', Test) {
	group = 'verification'
	description = 'Runs only integration tests'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	include '**/*IntegrationTest.class', '**/*IT.class'
	shouldRunAfter tasks.named('unitTest')
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs = [
			'-Amapstruct.suppressGeneratorTimestamp=true',
			'-Amapstruct.defaultComponentModel=spring'
	]
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-parameters'
}

jib {
	from {
		image = 'eclipse-temurin:21-jre-alpine'
	}
	to {
		image = System.getProperty('jib.to.image') ?: 'veritas-backend:latest'
		auth {
			username = System.getenv('CI_REGISTRY_USER') ?: ""
			password = System.getenv('CI_REGISTRY_PASSWORD') ?: ""
		}
	}
	container {
		mainClass = 'com.veritas.backend.BackendApplication'
		ports = ['8080']
		creationTime = 'USE_CURRENT_TIMESTAMP'
		jvmFlags = ['-Djava.security.egd=file:/dev/./urandom']
	}
}

openApiGenerate {
	generatorName = "typescript-angular"
	inputSpec = "$projectDir/../frontend/openapi.json".toString()
	outputDir = "$projectDir/../frontend/src/app/core/api".toString()

	configOptions = [
			"enumNameSuffix": "Enum",
			"stringEnums": "true",
			"supportsES6": "true",
			"withInterfaces": "true",
			"useInheritance": "true"
	]
}