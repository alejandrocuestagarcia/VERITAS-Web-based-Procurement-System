spring:
  autoconfigure:
    # This stops Spring from trying to set up Testcontainers automatically
    exclude:
      - org.springframework.boot.testcontainers.service.connection.ServiceConnectionAutoConfiguration

  datasource:
    # Uses H2 in PostgreSQL compatibility mode with a random DB name per context to prevent shared test pollution
    url: jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop

security:
  jwt:
    # Dummy key
    secret-key: ${JWT_SECRET_KEY:dev-only-secret-key-for-local-development-hs256}
    access-token-expiration: 1200000