spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/veritas_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

server:
  port: 8080
  tomcat:
    max-swallow-size: -1
    max-http-form-post-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html    # Access via /swagger-ui.html
    operations-sorter: alpha   # Sorts endpoints alphabetically
  api-docs:
    path: /api/v1/api.json
security:
  jwt:
    secret-key: ${JWT_SECRET_KEY:dev-only-secret-key-for-local-development-hs256}
    access-token-expiration: 1200000 # = 20 minutes
  encryption:
    key: ${ENCRYPTION_KEY:dev-only-encryption-key-32-chars!}
    salt: ${ENCRYPTION_SALT:deadbeefcafebabe0123456789abcdef}
  password-reset:
    expiration-hours: 24
    reset-link-base: ${PASSWORD_RESET_LINK_BASE:http://localhost:4200/reset-password}
    subject: Reset your Veritas password

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}

currency:
  primary-url: https://api.frankfurter.dev/v2/rates
  secondary-url: https://v6.exchangerate-api.com/v6
  secondary-api-key: ${EXCHANGE_RATE_API_KEY:}
  target-currencies: USD,GBP,CHF,JPY
  scheduler-interval-ms: 3600000 # = 60 minutes
