<h2 mat-dialog-title class="font-manrope font-bold text-slate-800 m-0 pb-4 border-b border-slate-100">
  {{ data?.isRevert ? 'Confirm Reversion' : 'Confirm Rejection' }}
</h2>
<mat-dialog-content class="pt-6">
  <p class="text-[14px] text-slate-600 mb-4">
    Are you sure you want to {{ data?.isRevert ? 'revert' : 'reject' }} this requisition? Please provide a reason below.
  </p>

  <div class="flex flex-col gap-2 w-full mt-2">
    <label class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">
      {{ data?.isRevert ? 'Reversion Reason' : 'Rejection Reason' }} <span class="text-red-500">*</span>
    </label>
    <textarea
      [(ngModel)]="reason"
      rows="4"
      class="w-full p-3 border border-slate-300 rounded-lg text-[14px] focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
      [class.focus:ring-red-500]="!data?.isRevert"
      [class.focus:border-red-500]="!data?.isRevert"
      placeholder="Type the reason here..."
      required>
    </textarea>
  </div>

  <div *ngIf="data?.isRevert" class="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-xl shadow-sm mt-4">
    <input
      type="checkbox"
      [(ngModel)]="revisionRequired"
      id="revisionRequiredCheckbox"
      class="w-4 h-4 rounded text-blue-600 border-slate-300 focus:ring-blue-500 cursor-pointer">
    <label for="revisionRequiredCheckbox" class="text-sm font-semibold text-slate-700 cursor-pointer select-none">
      Revision required
    </label>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="gap-3 pt-4 pb-2 pr-6 border-t border-slate-100">
  <button mat-flat-button (click)="onCancel()">
    Cancel
  </button>
  <button
    mat-flat-button
    [color]="data?.isRevert ? 'primary' : 'warn'"
    (click)="onConfirm()"
    [disabled]="!reason.trim()">
    {{ data?.isRevert ? 'Confirm Revert' : 'Confirm Rejection' }}
  </button>
</mat-dialog-actions>
