<h2 mat-dialog-title class="font-manrope font-bold text-slate-800 m-0 pb-4 border-b border-slate-100">Confirm Rejection</h2>
<mat-dialog-content class="pt-6">
  <p class="text-[14px] text-slate-600 mb-4">Are you sure you want to reject this requisition? Please provide a reason below.</p>

  <div class="flex flex-col gap-2 w-full mt-2">
    <label class="text-[12px] font-bold text-slate-500 uppercase tracking-wider">Rejection Reason <span class="text-red-500">*</span></label>
    <textarea
      [(ngModel)]="reason"
      rows="4"
      class="w-full p-3 border border-slate-300 rounded-lg text-[14px] focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none transition-all resize-none"
      placeholder="Type the reason for rejection here..."
      required>
        </textarea>
  </div>
</mat-dialog-content>
<mat-dialog-actions align="end" class="gap-3 pt-4 pb-2 pr-6 border-t border-slate-100">
  <button mat-flat-button (click)="onCancel()" >
    Cancel
  </button>
  <button mat-flat-button color= "warn" (click)="onConfirm()" [disabled]="!reason.trim()">
    Confirm Rejection
  </button>
</mat-dialog-actions>
