<div class="p-8">

  <!-- Page header -->
  <div class="flex items-start justify-between mb-6 gap-4">
    <div>
      <h1 class="font-manrope text-2xl font-bold text-on-surface m-0 mb-1 leading-tight">{{ title }}</h1>
      <p class="text-[13px] text-muted-grey m-0">{{ subtitle }}</p>
    </div>
    <div class="flex gap-2 items-center shrink-0 pt-1">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <!-- Stats slot -->
  <div class="flex gap-5 mb-8">
    <ng-content select="[stats]"></ng-content>
  </div>

  <!-- Table card -->
  <div class="bg-surface-white border border-border-white rounded-card overflow-hidden">

    <!-- Toolbar -->
    <div class="flex items-center justify-between px-5 py-3.5 border-b border-border-white">
      <!-- Search -->
      <div class="flex items-center gap-2 bg-surface-low border border-border-ghost rounded-search
                  px-3 py-1.5 transition-colors duration-150
                  focus-within:border-veritas-blue">
        <mat-icon>search</mat-icon>
        <input class="border-0 outline-none bg-transparent font-inter text-[13px]
                 text-on-surface w-full placeholder:text-[#9ca3af]" [placeholder]="searchPlaceholder"
          (input)="onSearch($event)" />
      </div>

      <!-- Filters slot -->
      <div>
        <ng-content select="[filters]"></ng-content>
      </div>
    </div>

    <!-- Table -->
    <table mat-table [dataSource]="dataSource" class="v-data-table">
      <ng-content select="[columns]"></ng-content>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Loading / empty state -->
    <div class="animate-delayed-fade opacity-0 p-10 text-center text-sm text-muted-grey" *ngIf="loading">Loading {{ entity }}…</div>
    <div class="p-10 text-center text-sm text-muted-grey" *ngIf="!loading && dataSource.data.length === 0">
      No {{ entity }} found
    </div>

    <!-- Paginator -->
    <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25]"
      (page)="pageChanged.emit($event)">
    </mat-paginator>
  </div>
</div>
