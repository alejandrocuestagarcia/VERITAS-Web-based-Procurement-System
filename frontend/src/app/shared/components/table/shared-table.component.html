<div class="p-4 sm:p-8">

  <!-- Page header -->
  <div class="flex flex-col sm:flex-row justify-between items-start mb-6 gap-4">
    <div>
      <h1 class="font-manrope text-2xl font-bold text-on-surface m-0 mb-1 leading-tight">{{ title }}</h1>
      <p class="text-[13px] text-muted-grey m-0">{{ subtitle }}</p>
    </div>
    <div class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center w-full sm:w-auto sm:shrink-0 pt-1">
      <ng-content select="[actions]"></ng-content>
    </div>
  </div>

  <!-- Stats slot -->
  <div class="flex flex-col sm:flex-row gap-4 sm:gap-5 mb-8">
    <ng-content select="[stats]"></ng-content>
  </div>

  <!-- Table card -->
  <div class="bg-surface-white border border-border-white rounded-card overflow-hidden">

    <!-- Toolbar -->
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center justify-between px-5 py-3.5 border-b border-border-white">
      <!-- Search -->
      <div class="flex items-center gap-2 bg-surface-low border border-border-ghost rounded-search
                  px-3 py-1.5 transition-colors duration-150
                  focus-within:border-veritas-blue w-full sm:w-72">
        <mat-icon>search</mat-icon>
        <input class="border-0 outline-none bg-transparent font-inter text-[13px]
                 text-on-surface w-full placeholder:text-[#9ca3af]" [placeholder]="searchPlaceholder"
          [value]="searchValue"
          (input)="onSearch($event)" />
      </div>

      <!-- Filters slot -->
      <div class="w-full sm:w-auto overflow-hidden">
        <ng-content select="[filters]"></ng-content>
      </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto w-full">
      <table mat-table [dataSource]="dataSource" class="v-data-table min-w-full">
        <ng-content select="[columns]"></ng-content>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.cursor-pointer]="rowClickable"
            [class.hover:bg-gray-50]="rowClickable" (click)="onRowClick($event, row)"></tr>
      </table>
    </div>

    <!-- Loading / empty state -->
    <div class="animate-delayed-fade opacity-0 p-10 text-center text-sm text-muted-grey" *ngIf="loading">Loading {{ entity }}…</div>
    <div class="p-10 text-center text-sm text-muted-grey" *ngIf="!loading && dataSource.data.length === 0">
      No {{ entity }} found
    </div>

    <!-- Paginator -->
    <mat-paginator [length]="totalElements" [pageSize]="pageSize" [pageSizeOptions]="[5, 10, 25]"
      (page)="pageChanged.emit($event)">
    </mat-paginator>
  </div>
</div>
