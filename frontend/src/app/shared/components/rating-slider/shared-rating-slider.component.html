<!--AI-GENERATED-->
<app-shared-form-field [label]="label">
  <div class="flex items-center gap-4 w-full" [formGroup]="form">
    <mat-icon class="text-slate-400 shrink-0 mb-3">{{ icon }}</mat-icon>
    <div class="flex-1 flex flex-col">
      <mat-slider min="0" max="10" step="1" discrete showTickMarks class="w-full">
        <input matSliderThumb [formControlName]="controlName">
      </mat-slider>
      <div class="relative text-[9px] text-slate-400 font-extrabold mx-[10px] -mt-2 h-4 select-none">
        <span class="absolute -translate-x-1/2" style="left: 0%;">0</span>
        <span class="absolute -translate-x-1/2" style="left: 10%;">1</span>
        <span class="absolute -translate-x-1/2" style="left: 20%;">2</span>
        <span class="absolute -translate-x-1/2" style="left: 30%;">3</span>
        <span class="absolute -translate-x-1/2" style="left: 40%;">4</span>
        <span class="absolute -translate-x-1/2" style="left: 50%;">5</span>
        <span class="absolute -translate-x-1/2" style="left: 60%;">6</span>
        <span class="absolute -translate-x-1/2" style="left: 70%;">7</span>
        <span class="absolute -translate-x-1/2" style="left: 80%;">8</span>
        <span class="absolute -translate-x-1/2" style="left: 90%;">9</span>
        <span class="absolute -translate-x-1/2" style="left: 100%;">10</span>
      </div>
    </div>
    <span class="font-extrabold text-blue-600 w-6 text-right text-[16px] shrink-0 mb-3">
      {{ form.get(controlName)?.value }}
    </span>
  </div>
</app-shared-form-field>
