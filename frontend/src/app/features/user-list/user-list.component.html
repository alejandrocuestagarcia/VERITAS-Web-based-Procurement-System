<!--AI-REFACTORED-->
<div class="page-container">


  <app-shared-table
    [title]="title"
    [subtitle]="subtitle"
    [dataSource]="dataSource"
    [displayedColumns]="displayedColumns"
    [totalElements]="totalPageElements"
    [loading]="loading"
    (pageChanged)="onPageChange($event)"
    (searchChanged)="onSearchChanged($event)">


    <ng-container stats>
      <div class="stat-row">
        <div class="stat-card">
          <span class="stat-label">Total Users</span>
          <span class="stat-value">{{ totalUserCount }}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Active Now</span>
          <span class="stat-value">{{ userSessions }}</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Inactive</span>
          <span class="stat-value">{{ inactiveUserCount }}</span>
        </div>
      </div>
    </ng-container>


    <div filters class="v-filter-group">
      <span class="v-filter-label">FILTER BY:</span>
      <mat-chip-listbox (change)="onRoleFilterChange($event.value)">
        <mat-chip-option value="ALL" [selected]="selectedRole === 'ALL'">
          All Roles
        </mat-chip-option>

        <mat-chip-option *ngFor="let role of userRoles" [value]="role">
          {{ role | formatEnum }}
        </mat-chip-option>
      </mat-chip-listbox>
    </div>

    <button actions mat-flat-button class="v-btn-brand" routerLink="users/create">
      <mat-icon>person_add</mat-icon>
      Add User
    </button>

    <ng-container columns>
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>NAME</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>EMAIL</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="team">
        <th mat-header-cell *matHeaderCellDef>TEAM</th>
        <td mat-cell *matCellDef="let user">
          <span class="team-chip">{{ user.teamName }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>ROLE</th>
        <td mat-cell *matCellDef="let user">{{ user.role | titlecase }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
        <td mat-cell *matCellDef="let user">
          <div class="v-action-group">
            <button mat-icon-button [routerLink]="['users', user.id, 'edit']" matTooltip="Edit User">
              <mat-icon>edit</mat-icon>
            </button>

            <span [matTooltip]="user.role === 'ADMINISTRATOR' ? 'Administrators cannot be deleted' : 'Delete user'">
            <button mat-icon-button color="warn" (click)="deleteUser(user)" [disabled]="user.role === UserDtoRoleEnum.Administrator">
              <mat-icon>delete</mat-icon>
            </button>
            </span>
          </div>
        </td>
      </ng-container>
    </ng-container>
  </app-shared-table>

</div>
