<app-shared-table [title]="title" [subtitle]="subtitle" [dataSource]="dataSource"
    [displayedColumns]="displayedColumns" [totalElements]="totalPageElements" [loading]="loading"
    (pageChanged)="onPageChange($event)" (searchChanged)="onSearchChanged($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Vendors" [value]="totalVendorCount" />
    <app-stat-card label="Average Score"  [value]="averageScore.toPrecision(2) + ' / 10'" />
  </ng-container>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" [routerLink]="['/vendors/create']">
    <mat-icon>add</mat-icon>
    <span>Add Vendor</span>
  </button>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="vendorName">
      <th mat-header-cell *matHeaderCellDef>NAME</th>
      <td mat-cell *matCellDef="let vendor" class="font-medium">{{ vendor.vendorName }}</td>
    </ng-container>

    <ng-container matColumnDef="taxId">
      <th mat-header-cell *matHeaderCellDef>TAX ID</th>
      <td mat-cell *matCellDef="let vendor">{{ vendor.taxId }}</td>
    </ng-container>

    <ng-container matColumnDef="overallScore">
      <th mat-header-cell *matHeaderCellDef>SCORE</th>
      <td mat-cell *matCellDef="let vendor">{{ vendor.overallScore }}</td>
    </ng-container>

    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef>PRIMARY CONTACT</th>
      <td mat-cell *matCellDef="let vendor" class="font-medium">{{ vendor.primaryContactName }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let vendor">
        <div class="flex items-center gap-1">
          <button mat-icon-button (click)="editVendor(vendor)" matTooltip="Edit Vendor">
            <mat-icon>edit</mat-icon>
          </button>
            <button mat-icon-button color="warn" (click)="deleteVendor(vendor)">
              <mat-icon>delete</mat-icon>
            </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
