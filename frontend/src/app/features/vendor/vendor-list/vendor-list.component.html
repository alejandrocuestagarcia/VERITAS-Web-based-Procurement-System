<app-shared-table [title]="title" [subtitle]="subtitle" [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="totalPageElements" [loading]="loading" [searchPlaceholder]="'Search vendors...'" (pageChanged)="onPageChange($event)"
  (searchChanged)="onSearchChanged($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Vendors" [value]="totalVendorCount" />
    <app-stat-card label="Average Rating" [value]="averageScore.toFixed(1) + ' / 10'" />
  </ng-container>

  <!-- Filters -->
  <div filters class="flex items-center gap-4 mr-2">
    <button mat-icon-button *ngIf="minimumRating > 0" (click)="clearRating()" matTooltip="Clear Rating Filter"
      class="text-muted-grey hover:text-warn transition-colors">
      <mat-icon>filter_list_off</mat-icon>
    </button>

    <div class="flex flex-col min-w-[150px] pl-4">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mt-1">Minimum Rating</span>
      <mat-slider min="0" max="10" step="0.5" discrete>
        <input matSliderThumb [value]="minimumRating" (valueChange)="onSliderChange($event)">
      </mat-slider>
    </div>

    <span class="text-[24px] font-manrope font-bold text-veritas-blue leading-tight tabular-nums">
      {{minimumRating.toFixed(1)}} / 10</span>
  </div>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" *appHasRole="['PROCUREMENT_OFFICER']" [routerLink]="['/vendors/create']">
    <mat-icon>add</mat-icon>
    <span>Add Vendor</span>
  </button>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="vendorName">
      <th mat-header-cell *matHeaderCellDef>NAME</th>
      <td mat-cell *matCellDef="let vendor" class="font-medium">{{ vendor.vendorName }}</td>
    </ng-container>

    <ng-container matColumnDef="taxId">
      <th mat-header-cell *matHeaderCellDef>TAX ID</th>
      <td mat-cell *matCellDef="let vendor">{{ vendor.taxId }}</td>
    </ng-container>

    <ng-container matColumnDef="rating">
      <th mat-header-cell *matHeaderCellDef>RATING</th>
      <td mat-cell *matCellDef="let vendor">{{ vendor.overallScore }}</td>
    </ng-container>

    <ng-container matColumnDef="contact">
      <th mat-header-cell *matHeaderCellDef>PRIMARY CONTACT</th>
      <td mat-cell *matCellDef="let vendor">
        <div class="flex flex-col">
          <span class="font-medium">{{ vendor.primaryContactName }}</span>
          <span class="text-slate-500 mt-0.5">{{ vendor.primaryContactEmail }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="!text-center" >ACTIONS</th>
      <td mat-cell *matCellDef="let vendor" class="!text-center" >
          <button mat-icon-button (click)="editVendor(vendor)" matTooltip="Edit Vendor">
            <mat-icon>edit</mat-icon>
          </button>

          <button mat-icon-button color="warn" (click)="deleteVendor(vendor)" matTooltip="Delete Vendor">
            <mat-icon>delete</mat-icon>
          </button>
      </td>
    </ng-container>

  </ng-container>

</app-shared-table>
