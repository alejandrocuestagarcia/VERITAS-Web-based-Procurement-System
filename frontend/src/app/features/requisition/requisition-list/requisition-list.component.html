<app-shared-table
  [title]="'Requisitions'"
  [subtitle]="'Manage and track all requisitions'"
  [entity]="'requisitions'"
  [dataSource]="requests"
  [displayedColumns]="displayedColumns"
  [totalElements]="totalElements"
  [loading]="loading"
  (pageChanged)="onPageChange($event)"
  (searchChanged)="onSearchChange($any($event))">

  <div actions *appHasRole="['REQUESTER']">
    <button mat-flat-button class="v-btn-brand" (click)="createNewRequest()">
      <mat-icon>add</mat-icon>
      <span>New Requisition</span>
    </button>
  </div>

  <div filters class="flex items-center gap-3">

    <button mat-icon-button
      *ngIf="status || selectedProjectId !== ''"
      (click)="clearFilters()"
      matTooltip="Clear All Filters"
      class="text-muted-grey hover:text-warn transition-colors">
      <mat-icon>filter_list_off</mat-icon>
    </button>

    <div class="flex flex-col" style="min-width: 200px;">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-0.5">Project</span>
      <mat-select [(ngModel)]="selectedProjectId" (ngModelChange)="onFilterChange()"
        class="text-[13px] text-on-surface font-inter" placeholder="All Projects"
        (openedChange)="onOpenedChange($event)">
        <div class="px-3 py-2 sticky top-0 bg-white z-10 border-b border-slate-100 mb-1">
          <div class="relative flex items-center">
            <mat-icon class="absolute left-2 text-slate-400 text-sm h-4 w-4">search</mat-icon>
            <input #projectSearchInput
              class="w-full pl-8 pr-3 py-1.5 text-sm bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:border-blue-400 focus:ring-1 focus:ring-blue-400 transition-all"
              placeholder="Search projects..." (input)="projectSearch = projectSearchInput.value"
              (keydown)="$event.stopPropagation()">
          </div>
        </div>
        <mat-option value="">All Projects</mat-option>
        <mat-option *ngFor="let p of getFilteredProjects()" [value]="p.id">{{ p.name }}</mat-option>
        <div *ngIf="getFilteredProjects().length === 0" class="p-4 text-center text-sm text-slate-500">
          No projects found
        </div>
      </mat-select>
    </div>

    <div class="flex items-center gap-4 ml-4">
      <span class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">
        Status:
      </span>
      <mat-chip-listbox [value]="status" (change)="onStatusFilterChange($event.value)">
        <mat-chip-option value="" [selected]="status === ''">All</mat-chip-option>
        <mat-chip-option *ngFor="let s of statuses" [value]="s.value" [selected]="status === s.value">
          {{ s.label }}
        </mat-chip-option>
      </mat-chip-listbox>
    </div>
  </div>

  <ng-container columns>
    <ng-container matColumnDef="requestName">
      <th mat-header-cell *matHeaderCellDef>REQUISITION</th>
      <td mat-cell *matCellDef="let req">
        <span class="font-medium text-slate-900">{{ req.requestName }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="projectName">
      <th mat-header-cell *matHeaderCellDef>PROJECT</th>
      <td mat-cell *matCellDef="let req">
        <div class="flex flex-col" *ngIf="req.projectName">
          <span class="font-medium text-slate-900">{{ req.projectName }}</span>
        </div>
        <span *ngIf="!req.projectName" class="text-slate-400 italic text-sm">No Project</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="workflowName">
      <th mat-header-cell *matHeaderCellDef class="!text-center" >USED WORKFLOW</th>
      <td mat-cell *matCellDef="let req" class="!text-center" >
        <span class="inline-flex items-center px-3 py-0.5 rounded-full text-[11px] font-manrope font-semibold bg-[#eef2ff] text-[#4338ca] border border-[#e0e7ff] tracking-tight">
          {{ req.workflowName }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="isClosed">
      <th mat-header-cell *matHeaderCellDef class="!text-center" >STATUS</th>
      <td mat-cell *matCellDef="let req" class="!text-center" >
        <span *ngIf="!req?.isClosed" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-green-50 text-green-700 border border-green-200">
          <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
          Open
        </span>
        <span *ngIf="req?.isClosed" class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold bg-slate-100 text-slate-600 border border-slate-200">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span>
          Closed
        </span>
      </td>
    </ng-container>


    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="!text-center" >ACTIONS</th>
      <td mat-cell *matCellDef="let req" class="!text-center">
        <button mat-icon-button (click)="viewDetails(req.id)" matTooltip="View Details" class="text-slate-600">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button (click)="changeRequester(req)" matTooltip="Change Requester" [disabled]="!isAdministrator && !isFinanceOfficer">
          <mat-icon>swap_horiz</mat-icon>
        </button>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
