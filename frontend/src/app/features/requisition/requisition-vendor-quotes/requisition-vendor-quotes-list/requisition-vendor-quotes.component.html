<app-shared-table
  [title]="'Vendor Quotes'"
  [subtitle]="requisition ? 'Manage, compare and select preferred vendor quotes for: ' + requisition.requestName : 'Manage vendor quotes for requisition.'"
  entity="vendor-quotes"
  searchPlaceholder="Search vendor quotes..."
  [dataSource]="dataSource"
  [displayedColumns]="displayedColumns"
  [totalElements]="dataSource.data.length"
  [loading]="loading"
  (searchChanged)="applyFilter($event)">

  <ng-container stats>
    <app-stat-card label="Total Quotes" [value]="quotes.length" />
    <app-stat-card label="Preferred Selected" [value]="hasPreferredQuote" />
  </ng-container>

  <button actions mat-flat-button class="v-btn-secondary" (click)="goBack()">
    <mat-icon class="scale-90">arrow_back</mat-icon>
    <span>Back to Requisition</span>
  </button>

  <button actions mat-flat-button class="v-btn-brand" (click)="navigateToCreate()">
    <mat-icon>add</mat-icon>
    <span>Add Vendor Quote</span>
  </button>

  <button filters mat-stroked-button class="v-btn-secondary" type="button">
    <mat-icon class="scale-90">compare_arrows</mat-icon>
    <span>Vendor Comparison</span>
  </button>

  <ng-container columns>
    <ng-container matColumnDef="vendor">
      <th mat-header-cell *matHeaderCellDef>VENDOR</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex flex-col py-2">
            <span class="font-bold text-gray-900 text-[14px]">
              {{ row.vendor?.vendorName || 'Unknown Vendor' }}
            </span>
          <span class="text-[11px] text-gray-400 font-semibold mt-0.5">
              Tax ID: {{ row.vendor?.taxId || 'N/A' }}
            </span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef>CURRENCY</th>
      <td mat-cell *matCellDef="let row">
          <span class="font-semibold text-gray-600 text-[13px] uppercase">
            {{ row.currency }}
          </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="totalAmount">
      <th mat-header-cell *matHeaderCellDef>TOTAL AMOUNT</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex flex-col py-2">
            <span class="font-extrabold text-[#0042d1] text-[15px]">
              {{ row.totalAmount | currency:row.currency }}
            </span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>STATUS</th>
      <td mat-cell *matCellDef="let row">
          <span *ngIf="row.isSelected" class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-extrabold bg-green-50 text-green-700 border border-green-200 uppercase tracking-wider">
            <mat-icon class="scale-75 -ml-1">check_circle</mat-icon> Selected
          </span>
        <span *ngIf="!row.isSelected" class="inline-flex items-center gap-1 px-3 py-1 rounded-full text-[11px] font-semibold bg-gray-50 text-gray-500 border border-gray-200 uppercase tracking-wider">
            Pending
          </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-1.5 py-1">
          <button mat-stroked-button color="primary" class="v-btn-brand-stroke text-[12px] font-extrabold flex items-center gap-1" *ngIf="!row.isSelected" (click)="selectQuote(row)" [disabled]="submitting">
            <mat-icon class="scale-75">check_circle</mat-icon> Select
          </button>

          <button mat-icon-button matTooltip="View Details" (click)="navigateToView(row.quoteId)">
            <mat-icon>visibility</mat-icon>
          </button>

          <button mat-icon-button matTooltip="Edit Quote" (click)="navigateToEdit(row.quoteId)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete Quote" color="warn" (click)="deleteQuote(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>
</app-shared-table>
