<app-shared-form
  title="Vendor Quote Details"
  [subtitle]="requisition ? 'Detailed view for requisition: ' + requisition.requestName : 'Detailed view for requisition'"
  routingSubtitle="REQUISITION > VENDOR QUOTES > VIEW"
  submitButtonLabel="Edit Quote"
  submitButtonIcon="edit"
  [loading]="loading"
  (submitted)="edit()"
  (cancelled)="back()">

  <app-shared-form-card icon="business" title="General Information">
    <app-shared-form-field label="Vendor">
      <mat-form-field appearance="outline" class="w-full">
        <input matInput type="text" [value]="quote?.vendor?.vendorName || ''" readonly class="text-slate-800 font-semibold">
      </mat-form-field>
    </app-shared-form-field>

    <app-shared-form-field label="Currency">
      <mat-form-field appearance="outline" class="w-full">
        <input matInput type="text" [value]="quote?.currency || ''" readonly class="text-slate-800 font-semibold">
      </mat-form-field>
    </app-shared-form-field>

    <app-shared-form-field label="Shipping Time">
      <mat-form-field appearance="outline" class="w-full">
        <input matInput type="text" [value]="quote?.shippingTime != null ? quote?.shippingTime + ' Days' : ''" readonly class="text-slate-800 font-semibold">
      </mat-form-field>
    </app-shared-form-field>
  </app-shared-form-card>

  <app-shared-form-card icon="payments" title="Financial Pricing & Totals">
    <app-shared-form-field label="Base Amount">
      <mat-form-field appearance="outline" class="w-full">
        <span matPrefix class="text-slate-400 font-semibold ml-2 mr-2">{{ quote?.currency }}</span>
        <input matInput type="text" [value]="quote?.baseAmount | number:'1.2-2'" readonly class="font-bold text-slate-700 text-[16px]">
      </mat-form-field>
    </app-shared-form-field>

    <app-shared-form-field label="Shipping & Handling">
      <mat-form-field appearance="outline" class="w-full">
        <span matPrefix class="text-slate-400 font-semibold ml-2 mr-2">{{ quote?.currency }}</span>
        <input matInput type="text" [value]="quote?.shippingCosts | number:'1.2-2'" readonly class="font-semibold text-slate-700">
      </mat-form-field>
    </app-shared-form-field>

    <app-shared-form-field label="Grand Total" [fullWidth]="true">
      <mat-form-field appearance="outline" class="w-full">
        <span matPrefix class="text-slate-400 font-semibold ml-2 mr-2">{{ quote?.currency }}</span>
        <input matInput type="text" [value]="quote?.totalAmount | number:'1.2-2'" readonly class="font-extrabold text-[#0042d1] text-[18px]">
      </mat-form-field>
    </app-shared-form-field>
  </app-shared-form-card>

  <app-shared-form-card icon="list_alt" title="Quote Line Items">
    <div class="w-full col-span-full">
      <div class="space-y-4">
        <div *ngFor="let item of quote?.items; let i = index" class="p-5 rounded-xl border border-slate-100 bg-slate-50/50 flex flex-col gap-4 relative">

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-start">
            <div class="md:col-span-6">
              <app-shared-form-field label="Product Name">
                <mat-form-field appearance="outline" class="w-full">
                  <input matInput type="text" [value]="item.productDescription" readonly class="text-slate-800">
                </mat-form-field>
              </app-shared-form-field>
            </div>

            <div class="md:col-span-2">
              <app-shared-form-field label="Qty">
                <mat-form-field appearance="outline" class="w-full">
                  <input matInput type="number" [value]="item.quantity" readonly class="text-slate-800">
                </mat-form-field>
              </app-shared-form-field>
            </div>

            <div class="md:col-span-4">
              <app-shared-form-field label="Unit Price">
                <mat-form-field appearance="outline" class="w-full">
                  <span matPrefix class="text-slate-400 font-semibold ml-2 mr-2">{{ quote?.currency }}</span>
                  <input matInput type="text" [value]="item.unitPrice | number:'1.2-2'" readonly class="text-slate-800">
                </mat-form-field>
              </app-shared-form-field>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
            <div class="md:col-span-8">
              <app-shared-form-field label="Link to Requisition Item">
                <mat-form-field appearance="outline" class="w-full">
                  <input matInput type="text" [value]="getLinkedItemName(item.requestItemId)" readonly class="text-slate-600 font-medium">
                </mat-form-field>
              </app-shared-form-field>
            </div>

            <div class="md:col-span-4 flex items-center justify-end h-full pt-4">
                <span class="text-[12px] text-slate-400 font-semibold">
                  Subtotal:
                  <strong class="text-slate-700 text-[14px] font-extrabold ml-1.5">
                    {{ ((item.quantity || 0) * (item.unitPrice || 0)) | currency:quote?.currency }}
                  </strong>
                </span>
            </div>
          </div>
        </div>

        <div class="p-8 border-2 border-dashed border-slate-200 rounded-xl text-center bg-slate-50/50" *ngIf="!quote?.items || quote?.items?.length === 0">
          <mat-icon class="text-slate-300 mb-2 scale-110">inventory_2</mat-icon>
          <p class="text-[13px] font-semibold text-slate-500">No line items in this vendor quote.</p>
        </div>
      </div>
    </div>
  </app-shared-form-card>
</app-shared-form>
