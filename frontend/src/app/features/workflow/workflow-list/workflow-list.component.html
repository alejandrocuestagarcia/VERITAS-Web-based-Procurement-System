<app-shared-table
  [title]="'Workflows'"
  [subtitle]="'Manage and view available procurement workflows'"
  entity="workflows"
  [dataSource]="dataSource"
  [displayedColumns]="displayedColumns"
  [totalElements]="totalElements"
  [loading]="loading"
  [pageSize]="pageSize"
  (pageChanged)="onPageChange($event)"
  (searchChanged)="onSearch($event)">

  <!-- Filters -->
  <div filters class="flex items-center gap-4">
    <span class="text-[11px] font-semibold text-gray-500 uppercase tracking-wider">
      Filter Status:
    </span>
    <mat-chip-listbox (change)="onStatusFilterChange($event.value)">
      <mat-chip-option
        *ngFor="let status of statusOptions"
        [value]="status"
        [selected]="selectedStatus === status">
        {{ status | titlecase }}
      </mat-chip-option>
    </mat-chip-listbox>
  </div>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" *ngIf="isFinanceOfficer || isAdministrator" [routerLink]="['/workflows/create']">
    <mat-icon>add</mat-icon>
    <span>Create Workflow</span>
  </button>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>WORKFLOW NAME</th>
      <td mat-cell *matCellDef="let workflow" class="font-medium">{{ workflow.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>DESCRIPTION</th>
      <td mat-cell *matCellDef="let workflow">{{ workflow.description }}</td>
    </ng-container>
    <!-- Unsure if Team is needed in workflows delete or add later if necessary
    <ng-container matColumnDef="team">
      <th mat-header-cell *matHeaderCellDef class="!text-center">ASSIGNED TEAM</th>
      <td mat-cell *matCellDef="let workflow" class="!text-center">
        <span class="px-2 py-1 bg-surface-low rounded text-xs font-semibold">
          {{ workflow.teamName || 'Global' }}
        </span>
      </td>
    </ng-container>
    -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="!text-center" >STATUS</th>
      <td mat-cell *matCellDef="let workflow" class="!text-center">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold"
              [ngClass]="workflow.isActive ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-slate-100 text-slate-600 border border-slate-200'">
          <span class="w-1.5 h-1.5 rounded-full" [ngClass]="workflow.isActive ? 'bg-green-500' : 'bg-slate-400'"></span>
          {{ workflow.isActive ? 'Active' : 'Inactive' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="!text-center ">ACTIONS</th>
      <td mat-cell *matCellDef="let workflow">
        <div class="flex items-center gap-1 justify-center">
          <button mat-icon-button matTooltip="View Workflow" [routerLink]="['/workflows/view', workflow.id]">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Edit Workflow" [routerLink]="['/workflows/edit', workflow.id]" [disabled]="!isFinanceOfficer && !isAdministrator">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete Workflow" color="warn" [routerLink]="['/workflows/delete', workflow.id]" [disabled]="!isFinanceOfficer && !isAdministrator">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
