<div class="flex flex-col h-screen bg-[#f7f9fb] p-6 lg:p-10 font-inter">

  <header class="flex justify-between items-end mb-6 border-b border-slate-200 pb-4">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold text-slate-900 m-0 mb-1">
          {{ workflowTitle || 'Untitled Workflow' }}
        </h1>
      </div>
    </div>
    <button mat-flat-button class="v-btn-brand justify-center">
      <mat-icon>edit</mat-icon>
      <span>Edit Workflow</span>
    </button>
  </header>

  <div class="flex justify-between items-center w-full mb-4">
    <div class="flex gap-2">
      <button (click)="zoomIn()" mat-flat-button class="ml-6 v-btn-secondary">
        <mat-icon>zoom_in</mat-icon>
        <span>Zoom In</span>
      </button>
      <button (click)="zoomOut()" mat-flat-button class="v-btn-secondary">
        <mat-icon>zoom_out</mat-icon>
        <span>Zoom Out</span>
      </button>
      <button (click)="resetZoom()" mat-flat-button class="v-btn-secondary">
        <mat-icon>center_focus_strong</mat-icon>
        <span>Reset View</span>
      </button>
    </div>
  </div>

  <div class="flex flex-1 overflow-hidden bg-white rounded-2xl border-2 border-[#e4e7ef] shadow-sm">

    <main class="relative flex-1 min-w-0 h-full overflow-hidden">
      <div #canvas class="w-full h-full"></div>
    </main>

    <aside *ngIf="showPropertiesPanelTransition"
      class="w-80 border-l border-[#e4e7ef] bg-slate-50/50 flex flex-col flex-shrink-0 animate-in slide-in-from-right duration-300">

      <div class="p-6 border-b border-[#e4e7ef] flex justify-between items-center bg-white">
        <h3 class="font-manrope font-bold text-slate-700 uppercase text-xs tracking-widest">Transition Logic</h3>
        <button (click)="showPropertiesPanelTransition = false" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="p-6 space-y-6 overflow-y-auto pointer-events-none opacity-80">

        <div class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Rule Configuration</label>
            <div class="flex items-center gap-3 p-4 mt-2 bg-white border border-[#e4e7ef] rounded-xl shadow-sm">
              <input type="checkbox" [checked]="currentRule.isPdfRequired" disabled
                class="w-4 h-4 rounded text-blue-600 border-slate-300">
              <span class="text-sm font-semibold text-slate-700">PDF Document Required</span>
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Minimum Vendors</label>
            <div class="mt-2 p-4 bg-white border border-[#e4e7ef] rounded-xl shadow-sm">
              <span class="text-xl font-bold text-[#003d9b]">{{ currentRule.minRequiredVendors }}</span>
              <span class="ml-2 text-xs text-slate-500 uppercase">Vendors</span>
            </div>
          </div>

          <div *ngIf="currentRule.optionalFailureMessage">
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Constraint Message</label>
            <div class="mt-2 p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
              <p class="text-xs text-blue-800 italic leading-relaxed">"{{ currentRule.optionalFailureMessage }}"</p>
            </div>
          </div>
        </div>
      </div>
    </aside>
    <aside *ngIf="showPropertiesPanelTask"
      class="w-80 border-l border-[#e4e7ef] bg-slate-50/50 flex flex-col flex-shrink-0 animate-in slide-in-from-right duration-300">

      <div class="p-6 border-b border-[#e4e7ef] flex justify-between items-center bg-white">
        <h3 class="font-manrope font-bold text-slate-700 uppercase text-xs tracking-widest">Transition Logic</h3>
        <button (click)="showPropertiesPanelTask = false" class="text-slate-400 hover:text-slate-600">
          <mat-icon>close</mat-icon>
        </button>
      </div>

      <div class="p-6 space-y-6 overflow-y-auto pointer-events-none opacity-80">

        <div class="space-y-4">
          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Assigned Person</label>
            <div class="flex items-center gap-3 p-4 mt-2 bg-white border border-[#e4e7ef] rounded-xl shadow-sm">
              <span class="text-sm font-semibold text-slate-700">Placeholder</span>
            </div>
          </div>

          <div>
            <label class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Description</label>
            <div class="mt-2 p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
              <p class="text-xs text-blue-800 italic leading-relaxed">Placeholder</p>
            </div>
          </div>
        </div>
      </div>
    </aside>

  </div>
</div>
