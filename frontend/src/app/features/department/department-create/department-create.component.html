<div [formGroup]="departmentForm">
  <app-shared-form [title]="isEditMode ? 'Edit Department' : 'Add New Department'"
    subtitle="Configure organizational divisions, manage administrative boundaries, and structure governance entities."
    [routingSubtitle]="isEditMode
      ? '<a href=\'/departments\' class=\'hover:text-blue-600 transition-colors\'>DEPARTMENTS</a> &gt; EDIT DEPARTMENT'
      : '<a href=\'/departments\' class=\'hover:text-blue-600 transition-colors\'>DEPARTMENTS</a> &gt; ADD NEW DEPARTMENT'"
    [submitButtonLabel]="submitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Save Changes' : 'Save Department')"
    [submitButtonIcon]="isEditMode ? 'save' : 'save'" [loading]="submitting" (submitted)="submit()"
    (cancelled)="cancel()">

    <app-shared-form-card icon="badge" title="Core Department Details">
      <app-shared-form-field label="DEPARTMENT NAME">
        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>business</mat-icon>
          <input matInput type="text" formControlName="name" placeholder="e.g. Finance Operations">
          <mat-error *ngIf="departmentForm.get('name')?.hasError('required') && departmentForm.get('name')?.touched">Department name is required.</mat-error>
          <mat-error *ngIf="departmentForm.get('name')?.hasError('minlength') && departmentForm.get('name')?.touched">Department name must be at least 2 characters.</mat-error>
        </mat-form-field>
      </app-shared-form-field>
    </app-shared-form-card>

    <app-shared-form-card icon="account_balance" title="Financials">
      <app-shared-form-field label="TOTAL BUDGET">
        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>payments</mat-icon>
          <input matInput type="number" formControlName="budget" placeholder="e.g. 50000">
          <mat-error *ngIf="departmentForm.get('budget')?.hasError('required') && departmentForm.get('budget')?.touched">Budget is required.</mat-error>
          <mat-error *ngIf="departmentForm.get('budget')?.hasError('min') && departmentForm.get('budget')?.touched">Budget must be a positive amount.</mat-error>
        </mat-form-field>
      </app-shared-form-field>
    </app-shared-form-card>

  </app-shared-form>
</div>
