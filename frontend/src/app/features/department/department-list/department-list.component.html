<app-shared-table title="Department Governance"
  subtitle="Manage corporate organizational structure, organize functional divisions, and define administrative boundaries."
  entity="departments" searchPlaceholder="Search departments..." [dataSource]="dataSource"
  [displayedColumns]="displayedColumns" [totalElements]="dataSource.data.length" [loading]="loading"
  (searchChanged)="onSearchChanged($event)">

  <ng-container stats>
    <app-stat-card label="Total Departments" [value]="totalDepartments" />
    <app-stat-card label="Total Teams" [value]="totalTeams" />
  </ng-container>

  <button actions mat-flat-button class="v-btn-brand" (click)="navigateToAddDepartment()">
    <mat-icon>add</mat-icon>
    <span>Add Department</span>
  </button>

  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>DEPARTMENT NAME</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-3">
          <mat-icon class="text-veritas-brand opacity-80">business</mat-icon>
          <span class="font-medium text-[14px] text-gray-900">{{ row.name }}</span>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="teams">
      <th mat-header-cell *matHeaderCellDef>ASSOCIATED TEAMS</th>
      <td mat-cell *matCellDef="let row">
        <span
          class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[12px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
          {{ row.teamsCount }} {{ row.teamsCount === 1 ? 'Team' : 'Teams' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-1">
          <button mat-icon-button matTooltip="Edit Department" (click)="navigateToEditDepartment(row.id)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete Department" color="warn" (click)="deleteDepartment(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
