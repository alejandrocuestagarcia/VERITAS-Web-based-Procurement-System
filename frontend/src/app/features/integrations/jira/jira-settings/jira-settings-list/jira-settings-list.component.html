<app-shared-table [title]="title" [subtitle]="subtitle" entity="integrations"
  [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="totalPageElements" [loading]="loading"
  (pageChanged)="onPageChange($event)" (searchChanged)="onSearchChanged($event)">

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" [routerLink]="['/integrations/create']">
    <mat-icon>add_link</mat-icon>
    <span>Add Integration</span>
  </button>

  <button filters mat-stroked-button [routerLink]="['/integrations/sync-history']">
    <mat-icon>history</mat-icon>
    <span>Sync History</span>
  </button>
  <button filters mat-stroked-button class = "ml-3" (click)="syncAll()" [disabled]="loading">
    <mat-icon [class.animate-spin]="loading">sync</mat-icon>
    <span>Sync All</span>
  </button>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>NAME</th>
      <td mat-cell *matCellDef="let config" class="font-medium">{{ config.name }}</td>
    </ng-container>

    <ng-container matColumnDef="jiraUrl">
      <th mat-header-cell *matHeaderCellDef>JIRA URL</th>
      <td mat-cell *matCellDef="let config">{{ config.jiraUrl }}</td>
    </ng-container>

    <ng-container matColumnDef="syncInterval">
      <th mat-header-cell *matHeaderCellDef>INTERVAL</th>
      <td mat-cell *matCellDef="let config">{{ config.syncIntervalMinutes }} min</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th class = "!text-center"  mat-header-cell *matHeaderCellDef>STATUS</th>
      <td class = "!text-center" mat-cell *matCellDef="let config">
        <span *ngIf="isRunning(config)" class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-green-100 text-green-800">
          <span class="w-1.5 h-1.5 mr-1.5 bg-green-500 rounded-full animate-pulse"></span>
          Active
        </span>
        <span *ngIf="!isRunning(config)" class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600">
          Paused
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="nextSync">
      <th class = "!text-center"  mat-header-cell *matHeaderCellDef>NEXT SYNC</th>
      <td mat-cell *matCellDef="let config" class="text-slate-500">
        <div class="justify-center flex items-center gap-1" *ngIf="isRunning(config)">
          <mat-icon class="text-[14px] w-[14px] h-[14px] pt-1.5">schedule</mat-icon>
          {{ getNextSyncTime(config) | date:'shortTime' }}
        </div>
        <span *ngIf="!isRunning(config)">-</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th class = "!text-center" mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let config">
        <div class="flex justify-center items-center gap-1">
          <button mat-icon-button color="accent" (click)="triggerSync(config)" matTooltip="Sync Now">
            <mat-icon>sync</mat-icon>
          </button>
          <button mat-icon-button (click)="editConfig(config)" matTooltip="Edit Config">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteConfig(config)" matTooltip="Delete Config">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
