<app-shared-table
  (pageChanged)="onPageChange($event)"
  (searchChanged)="onSearchChanged($event)"
  [dataSource]="dataSource"
  [displayedColumns]="displayedColumns"
  [loading]="loading"
  [subtitle]="'Audit log of all Jira synchronization events'"
  [title]="'Sync History'"
  [totalElements]="totalElements"
  entity="sync events">

  <!-- Actions -->
  <button (click)="goBack()" actions class="v-btn-secondary" mat-flat-button>
    <mat-icon>arrow_back</mat-icon>
    <span>Back</span>
  </button>

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card [value]="totalElements" label="Synced Requests"/>
  </ng-container>

  <ng-container columns>
    <ng-container matColumnDef="requestName">
      <th *matHeaderCellDef mat-header-cell>REQUEST</th>
      <td *matCellDef="let log" class="font-medium" mat-cell>{{ log.requestName }}</td>
    </ng-container>

    <ng-container matColumnDef="requestKey">
      <th *matHeaderCellDef mat-header-cell>JIRA ISSUES</th>
      <td *matCellDef="let row" mat-cell>
        <a *ngIf="row.jiraIssueUrl; else plainKey"
           [href]="row.jiraIssueUrl"
           class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium text-blue-600 border border-blue-400 rounded hover:bg-blue-50 transition-colors"
           rel="noopener noreferrer"
           target="_blank">
          <mat-icon class="!text-base !w-4 !h-4 !leading-none flex-shrink-0 flex items-center justify-center">
            open_in_new
          </mat-icon>
          {{ row.requestKey }}
        </a>
        <ng-template #plainKey>{{ row.requestKey }}</ng-template>
      </td>
    </ng-container>

    <ng-container matColumnDef="user">
      <th *matHeaderCellDef mat-header-cell>ACTOR</th>
      <td *matCellDef="let log" mat-cell>
        <div class="flex items-center gap-2">
          <mat-icon class="text-[14px] w-[14px] h-[14px] text-slate-400 pt-1.5">
            {{ log.user === 'System' ? 'schedule' : 'person' }}
          </mat-icon>
          {{ log.user }}
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="timestamp">
      <th *matHeaderCellDef mat-header-cell>TIMESTAMP</th>
      <td *matCellDef="let log" class="text-slate-500" mat-cell>
        {{ log.timestamp | date:'medium' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="action">
      <th *matHeaderCellDef mat-header-cell>ACTION</th>
      <td *matCellDef="let log" mat-cell>
          <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium
                       bg-green-100 text-green-800">
            {{ log.action }}
          </span>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
