<div class="p-8">
  <div class="flex items-center gap-3 mb-6">
    <button mat-icon-button (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1 class="font-manrope text-2xl font-bold text-on-surface m-0 mb-1 leading-tight">Sync History</h1>
      <p class="text-[13px] text-muted-grey m-0">Audit log of all Jira synchronization events</p>
    </div>
  </div>

  <div class="-mt-8">
    <app-shared-table
      entity="sync events"
      title=""
      subtitle=""
      [dataSource]="dataSource"
      [displayedColumns]="displayedColumns"
      [totalElements]="dataSource.data.length"
      [loading]="loading"
      (searchChanged)="onSearchChanged($event)">

      <!-- Stats -->
      <ng-container stats>
        <app-stat-card label="Synced Issues" [value]="dataSource.data.length" />
      </ng-container>

      <ng-container columns>
        <ng-container matColumnDef="requestName">
          <th mat-header-cell *matHeaderCellDef>REQUEST</th>
          <td mat-cell *matCellDef="let log" class="font-medium">{{ log.requestName }}</td>
        </ng-container>

        <ng-container matColumnDef="requestKey">
          <th mat-header-cell *matHeaderCellDef>Jira Issue</th>
          <td mat-cell *matCellDef="let row">
            <a *ngIf="row.jiraIssueUrl; else plainKey"
               [href]="row.jiraIssueUrl"
               target="_blank"
               rel="noopener noreferrer"
               mat-stroked-button
               color="primary"
               style="font-size: 12px; line-height: 24px; padding: 0 8px; min-width: unset;">
              <mat-icon style="font-size: 14px; height: 14px; width: 14px; vertical-align: middle;">open_in_new</mat-icon>
              {{ row.requestKey }}
            </a>
            <ng-template #plainKey>{{ row.requestKey }}</ng-template>
          </td>
        </ng-container>

        <ng-container matColumnDef="user">
          <th mat-header-cell *matHeaderCellDef>ACTOR</th>
          <td mat-cell *matCellDef="let log">
            <div class="flex items-center gap-2">
              <mat-icon class="text-[14px] w-[14px] h-[14px] text-slate-400 pt-1.5">
                {{ log.user === 'System' ? 'schedule' : 'person' }}
              </mat-icon>
              {{ log.user }}
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="timestamp">
          <th mat-header-cell *matHeaderCellDef>TIMESTAMP</th>
          <td mat-cell *matCellDef="let log" class="text-slate-500">
            {{ log.timestamp | date:'medium' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>ACTION</th>
          <td mat-cell *matCellDef="let log">
          <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium
                       bg-green-100 text-green-800">
            {{ log.action }}
          </span>
          </td>
        </ng-container>
      </ng-container>

    </app-shared-table>
  </div>
</div>
