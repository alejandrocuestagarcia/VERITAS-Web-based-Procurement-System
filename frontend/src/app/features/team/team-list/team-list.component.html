<app-shared-table title="Team Governance"
  subtitle="Orchestrate cross-functional teams, define departmental boundaries, and align human capital with strategic projects."
  entity="teams" searchPlaceholder="Search..."
  [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="dataSource.data.length" [loading]="loading"
  (searchChanged)="onSearchChanged($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Teams" [value]="totalTeams" />
    <app-stat-card label="Active Projects" [value]="totalProjects" />
    <app-stat-card label="Departments" [value]="totalDepartments" />
  </ng-container>

  <!-- Filters -->
  <div filters class="flex items-center gap-3">
    <span class="text-[11px] font-semibold text-muted-grey uppercase tracking-wider">Filter by:</span>
    <mat-chip-listbox (change)="onDepartmentFilterChange($event.value)">
      <mat-chip-option value="all" [selected]="activeDepartmentFilter === 'all'">All Teams</mat-chip-option>
      <mat-chip-option *ngFor="let filter of departmentFilters" [value]="filter.key" [selected]="activeDepartmentFilter === filter.key">{{ filter.label }}</mat-chip-option>
    </mat-chip-listbox>
  </div>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" (click)="navigateToAddTeam()">
    <mat-icon>group_add</mat-icon>
    <span>Add Team</span>
  </button>

  <!-- Error -->
  <div *ngIf="error" filters
       class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-2 text-sm">
    {{ error }}
  </div>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="identity">
      <th mat-header-cell *matHeaderCellDef>IDENTITY</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-3">
          <div class="flex flex-col">
            <span class="font-medium text-[14px] text-gray-900">{{ row.name }}</span>
            <span class="text-[12px] text-gray-500 font-semibold tracking-wide">{{ row.membersCount }} MEMBERS</span>
          </div>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>DEPARTMENT</th>
      <td mat-cell *matCellDef="let row" class="text-gray-700 font-semibold text-[13px]">{{ row.departmentLabel }}</td>
    </ng-container>

    <ng-container matColumnDef="projects">
      <th mat-header-cell *matHeaderCellDef>PROJECTS</th>
      <td mat-cell *matCellDef="let row" class="text-gray-700 max-w-[200px] truncate font-semibold text-[13px]" [title]="row.projectNames">{{ row.projectsText }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>STATUS</th>
      <td mat-cell *matCellDef="let row">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold"
              [ngClass]="row.isActive ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-slate-100 text-slate-600 border border-slate-200'">
          <span class="w-1.5 h-1.5 rounded-full" [ngClass]="row.isActive ? 'bg-green-500' : 'bg-slate-400'"></span>
          {{ row.statusLabel }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-1">
          <button mat-icon-button matTooltip="Edit Team" (click)="navigateToEditTeam(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete Team" color="warn" (click)="deleteTeam(row)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
