<app-shared-table title="Team Governance"
  subtitle="Orchestrate cross-functional teams, define departmental boundaries, and align human capital with strategic projects."
  entity="teams" searchPlaceholder="Search teams..."
  [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="dataSource.data.length" [loading]="loading"
  (searchChanged)="onSearchChanged($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Teams" [value]="totalTeams" />
    <app-stat-card label="Active Projects" [value]="totalProjects" />
    <app-stat-card label="Departments" [value]="totalDepartments" />
  </ng-container>

  <!-- Filters -->
  <!--AI-Generated-->
  <div filters class="w-full font-inter req-filter-pill-wrapper">
    <div class="flex items-center gap-2 flex-nowrap overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">

      <div class="shrink-0">
        <button
          class="inline-flex items-center gap-1.5 h-9 px-3.5 rounded-lg border text-[13px] font-medium cursor-pointer whitespace-nowrap transition-all outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
          [class]="activeDepartmentFilter !== 'all' ? 'border-blue-400 bg-blue-50 text-blue-700' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:bg-slate-50'"
          (click)="toggleDropdown('department', $event)">
          <mat-icon class="!flex items-center justify-center text-[16px] !w-4 !h-4 leading-none shrink-0" [class]="activeDepartmentFilter !== 'all' ? 'text-blue-500' : 'text-slate-400'">business</mat-icon>
          <span>{{ getSelectedDepartmentLabel() }}</span>
          <mat-icon class="!flex items-center justify-center text-[16px] !w-4 !h-4 leading-none shrink-0" [class]="activeDepartmentFilter !== 'all' ? 'text-blue-300' : 'text-slate-300'">expand_more</mat-icon>
        </button>

        <!-- Department dropdown -->
        <div *ngIf="activeDropdown === 'department'" class="req-dropdown bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden min-w-[224px] max-w-[280px]"
          [style.top.px]="dropdownY" [style.left.px]="dropdownX">
          <div class="p-2 border-b border-slate-100">
            <div class="flex items-center gap-1.5 px-2 py-1 bg-slate-50 rounded-lg border border-slate-200/60">
              <mat-icon class="text-slate-400 text-[15px] !w-3.5 !h-3.5 leading-none">search</mat-icon>
              <input class="w-full border-0 outline-none bg-transparent text-[12px]" placeholder="Search departments..."
                [(ngModel)]="departmentSearch" (click)="$event.stopPropagation()" />
            </div>
          </div>
          <div class="py-1 max-h-[240px] overflow-y-auto">
            <button class="flex items-center gap-2 w-full px-3 py-2 text-[13px] text-left transition-colors"
              [class]="activeDepartmentFilter === 'all' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-50'"
              (click)="setDepartmentFilter('all')">
              <mat-icon class="req-icon-check text-blue-500" *ngIf="activeDepartmentFilter === 'all'">check</mat-icon>
              <span class="w-[13px]" *ngIf="activeDepartmentFilter !== 'all'"></span>
              All Departments
            </button>
            <button *ngFor="let d of getFilteredDepartments()"
              class="flex items-center gap-2 w-full px-3 py-2 text-[13px] text-left transition-colors truncate"
              [class]="activeDepartmentFilter === d.key ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-50'"
              [title]="d.label"
              (click)="setDepartmentFilter(d.key)">
              <mat-icon class="req-icon-check text-blue-500" *ngIf="activeDepartmentFilter === d.key">check</mat-icon>
              <span class="w-[13px]" *ngIf="activeDepartmentFilter !== d.key"></span>
              {{ d.label }}
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" (click)="navigateToAddTeam()">
    <mat-icon>group_add</mat-icon>
    <span>Add Team</span>
  </button>

  <!-- Error -->
  <div *ngIf="error" filters
       class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-2 text-sm">
    {{ error }}
  </div>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="identity">
      <th mat-header-cell *matHeaderCellDef>IDENTITY</th>
      <td mat-cell *matCellDef="let row">
        <div class="flex items-center gap-3">
          <div class="flex flex-col">
            <span class="font-medium text-[14px] text-gray-900">{{ row.name }}</span>
            <span class="text-[12px] text-gray-500 font-semibold tracking-wide">{{ row.membersCount }} MEMBERS</span>
          </div>
        </div>
      </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef class="!text-center">DEPARTMENT</th>
      <td mat-cell *matCellDef="let row" class="text-gray-700 font-semibold text-[13px] !text-center">
                <span class="px-2 py-1 bg-surface-low rounded">
                  {{ row.departmentLabel }}
                </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="projects">
      <th mat-header-cell *matHeaderCellDef>PROJECTS</th>
      <td mat-cell *matCellDef="let row" class="text-gray-700 max-w-[200px] truncate font-semibold text-[13px]" [title]="row.projectNames">{{ row.projectsText }}</td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef class="!text-center">STATUS</th>
      <td mat-cell *matCellDef="let row" class="!text-center">
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-bold"
              [ngClass]="row.isActive ? 'bg-green-50 text-green-700 border border-green-200' : 'bg-slate-100 text-slate-600 border border-slate-200'">
          <span class="w-1.5 h-1.5 rounded-full" [ngClass]="row.isActive ? 'bg-green-500' : 'bg-slate-400'"></span>
          {{ row.statusLabel }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="!text-center">ACTIONS</th>
      <td mat-cell *matCellDef="let row" class="!text-center">
          <button mat-icon-button matTooltip="Edit Team" (click)="navigateToEditTeam(row)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button matTooltip="Delete Team" color="warn" (click)="deleteTeam(row)">
            <mat-icon>delete</mat-icon>
          </button>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
