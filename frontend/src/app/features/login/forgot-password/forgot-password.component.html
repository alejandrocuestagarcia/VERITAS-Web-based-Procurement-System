<!-- AI-GENERATED -->
<div class="flex flex-col justify-center items-center min-h-screen">

  <div class="flex flex-col items-center gap-4 w-[440px]">

    <div class="flex flex-col items-center gap-3">
      <div class="flex items-center px-4 py-3 bg-veritas-blue rounded-lg">
        <mat-icon class="text-white w-8 h-8">security</mat-icon>
      </div>
      <div class="text-veritas-dark font-bold text-[2.5rem] font-manrope">VERITAS</div>
      <div class="text-slate-600 text-sm -mt-2">Enterprise Procurement &amp; Governance</div>
    </div>

    <mat-card class="w-full px-10 pt-10 pb-14 rounded-lg shadow-md">
      <form class="flex flex-col gap-6 w-full" [formGroup]="requestForm" (ngSubmit)="onSubmit()">
        <div class="text-sm text-slate-600">
          Enter your email address and we will send you a password reset link.
        </div>

        <div class="flex flex-col gap-2">
          <div class="font-bold text-on-surface">Email</div>
          <mat-form-field appearance="outline" class="w-full">
            <mat-icon matPrefix>email</mat-icon>
            <input matInput type="email" formControlName="email" placeholder="name@company.com" required>
            <mat-error *ngIf="requestForm.get('email')?.hasError('required') && requestForm.get('email')?.touched">
              Email is required.
            </mat-error>
            <mat-error *ngIf="requestForm.get('email')?.hasError('email') && requestForm.get('email')?.touched">
              Enter a valid email address.
            </mat-error>
          </mat-form-field>
        </div>

        <button type="submit" mat-flat-button class="v-btn-brand" [disabled]="loading">
          <mat-icon>mail</mat-icon>
          <span>Send reset link</span>
        </button>

        <button type="button" mat-button class="self-center" (click)="onBackToLogin()">
          Back to login
        </button>
      </form>
    </mat-card>
  </div>

  <footer class="mt-12 text-xs text-muted-grey text-center">
    VERITAS v2.4.1
  </footer>

</div>
