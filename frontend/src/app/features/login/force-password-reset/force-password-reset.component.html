<div [formGroup]="resetForm">
  <app-shared-form
    title="Security Update Required"
    subtitle="Your account is flagged for a mandatory password change. Please set a new password to continue."
    submitButtonLabel="Update and Sign In"
    submitButtonIcon="lock_reset"
    [loading]="loading"
    (submitted)="onSubmit()"
    (cancelled)="onCancel()">

    <app-shared-form-card title="Account Credentials" icon="lock">

      <app-shared-form-field label="NEW PASSWORD">
        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword" placeholder="Min. 8 characters" />
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('required') && resetForm.get('newPassword')?.touched">
            Password is required.
          </mat-error>
          <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength') && resetForm.get('newPassword')?.touched">
            Minimum 8 characters required.
          </mat-error>
        </mat-form-field>
      </app-shared-form-field>

      <app-shared-form-field label="CONFIRM NEW PASSWORD">
        <mat-form-field appearance="outline" class="w-full">
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword" placeholder="Repeat your password" />
          <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>
      </app-shared-form-field>

      <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
           class="col-span-2 text-red-500 text-sm font-medium italic -mt-2">
        * Passwords do not match.
      </div>

    </app-shared-form-card>

  </app-shared-form>
</div>
