<div class="flex items-center justify-center min-h-screen bg-slate-50 p-4" [formGroup]="resetForm">
  <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">

    <app-shared-form
      title="Security Update Required"
      subtitle="Your account is flagged for a mandatory password change. Please set a new password to continue."
      submitButtonLabel="Update and Sign In"
      [loading]="loading"
      (submitted)="onSubmit()"
      (cancelled)="onCancel()">

      <app-shared-form-card title="Account Credentials" icon="lock">

        <app-shared-form-field label="New Password">
          <mat-form-field appearance="outline" class="w-full">
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="newPassword">
            <mat-icon matSuffix (click)="hidePassword = !hidePassword" class="cursor-pointer text-slate-400 hover:text-slate-600">
              {{hidePassword ? 'visibility_off' : 'visibility'}}
            </mat-icon>
            <mat-error *ngIf="resetForm.get('newPassword')?.hasError('minlength')">
              Minimum 8 characters required.
            </mat-error>
          </mat-form-field>
        </app-shared-form-field>

        <app-shared-form-field label="Confirm New Password">
          <mat-form-field appearance="outline" class="w-full">
            <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword">
          </mat-form-field>
        </app-shared-form-field>

      </app-shared-form-card>

      <div *ngIf="resetForm.hasError('mismatch') && resetForm.get('confirmPassword')?.touched"
           class="px-8 pb-4 text-red-500 text-sm font-medium italic">
        * Passwords do not match.
      </div>

    </app-shared-form>
  </div>
</div>
