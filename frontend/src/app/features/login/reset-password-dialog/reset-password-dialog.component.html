<!--AI-GENERATED-->

<div class="flex flex-col gap-1 p-4">

  <div class="flex items-center gap-3 mb-2">
    <div class="flex items-center justify-center w-12 h-12 rounded-full bg-red-50">
      <mat-icon class="text-red-500">lock_reset</mat-icon>
    </div>
    <div>
      <h2 class="text-lg font-semibold m-0">Reset Password</h2>
      <p class="text-sm text-slate-500 m-0">{{ data.user }}</p>
    </div>
  </div>

  <mat-divider class="mb-4"></mat-divider>

  <mat-dialog-content class="flex flex-col gap-4 !px-0">
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 flex gap-3 mb-8">
      <mat-icon class="text-amber-500 shrink-0 mt-0.5">warning</mat-icon>
      <p class="text-sm text-amber-800 m-0">
        A temporary password will be issued. The user will be forced to change it on their next login.
      </p>
    </div>

    <app-shared-form-field label="TEMPORARY PASSWORD">
      <mat-form-field appearance="outline" class="w-full">
        <mat-icon matPrefix>lock</mat-icon>
        <input matInput [type]="hidePassword ? 'password' : 'text'" [formControl]="tempPassword" placeholder="Min. 8 characters" />
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="tempPassword.hasError('required')">Password is required</mat-error>
        <mat-error *ngIf="tempPassword.hasError('minlength')">Minimum 8 characters</mat-error>
      </mat-form-field>
    </app-shared-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="!px-0 gap-2 pt-2">
    <button mat-stroked-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-flat-button color="warn" type="button" (click)="onConfirm()" [disabled]="tempPassword.invalid">
      <mat-icon class="mr-1">lock_reset</mat-icon>
      Reset Password
    </button>
  </mat-dialog-actions>

</div>
