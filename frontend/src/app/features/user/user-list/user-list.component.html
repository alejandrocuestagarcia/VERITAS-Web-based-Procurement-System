<app-shared-table [title]="title" [subtitle]="subtitle" entity="users"
  [searchPlaceholder]="'Search users...'"
  [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="totalPageElements" [loading]="loading"
  (pageChanged)="onPageChange($event)" (searchChanged)="onSearchChanged($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Users" [value]="totalUserCount" />
    <app-stat-card label="Active Now"  [value]="userSessions" />
    <app-stat-card label="Inactive"    [value]="inactiveUserCount" />
  </ng-container>

  <!-- Filters -->
  <!--AI-Generated-->
  <div filters class="w-full font-inter req-filter-pill-wrapper">
    <div class="flex items-center gap-2 flex-nowrap overflow-x-auto [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">

      <div class="shrink-0">
        <button
          class="inline-flex items-center gap-1.5 h-9 px-3.5 rounded-lg border text-[13px] font-medium cursor-pointer whitespace-nowrap transition-all outline-none focus-visible:ring-2 focus-visible:ring-blue-400"
          [class]="selectedRole !== 'ALL' ? 'border-blue-400 bg-blue-50 text-blue-700' : 'border-slate-200 bg-white text-slate-600 hover:border-slate-300 hover:bg-slate-50'"
          (click)="toggleDropdown('role', $event)">
          <mat-icon class="!flex items-center justify-center text-[16px] !w-4 !h-4 leading-none shrink-0" [class]="selectedRole !== 'ALL' ? 'text-blue-500' : 'text-slate-400'">admin_panel_settings</mat-icon>
          <span>{{ getSelectedRoleLabel() }}</span>
          <mat-icon class="!flex items-center justify-center text-[16px] !w-4 !h-4 leading-none shrink-0" [class]="selectedRole !== 'ALL' ? 'text-blue-300' : 'text-slate-300'">expand_more</mat-icon>
        </button>

        <!-- Role dropdown -->
        <div *ngIf="activeDropdown === 'role'" class="req-dropdown bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden min-w-[200px]"
          [style.top.px]="dropdownY" [style.left.px]="dropdownX">
          <div class="py-1">
            <button class="flex items-center gap-2 w-full px-3 py-2 text-[13px] text-left transition-colors"
              [class]="selectedRole === 'ALL' ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-50'"
              (click)="setRoleFilter('ALL')">
              <mat-icon class="req-icon-check text-blue-500" *ngIf="selectedRole === 'ALL'">check</mat-icon>
              <span class="w-[13px]" *ngIf="selectedRole !== 'ALL'"></span>
              All Roles
            </button>
            <button *ngFor="let r of userRoles"
              class="flex items-center gap-2 w-full px-3 py-2 text-[13px] text-left transition-colors"
              [class]="selectedRole === r ? 'bg-blue-50 text-blue-700 font-semibold' : 'text-slate-700 hover:bg-slate-50'"
              (click)="setRoleFilter(r)">
              <mat-icon class="req-icon-check text-blue-500" *ngIf="selectedRole === r">check</mat-icon>
              <span class="w-[13px]" *ngIf="selectedRole !== r"></span>
              {{ r | formatEnum }}
            </button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" [routerLink]="['/users/create']">
    <mat-icon>person_add</mat-icon>
    <span>Add User</span>
  </button>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>NAME</th>
      <td mat-cell *matCellDef="let user" class="font-medium">{{ user.name }}</td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>EMAIL</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="team">
      <th mat-header-cell *matHeaderCellDef>TEAM</th>
      <td mat-cell *matCellDef="let user">{{ user.teamName }}</td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef class="!text-center">DEPARTMENT</th>
      <td mat-cell *matCellDef="let user" class="font-medium !text-center">
        <span *ngIf="user.departmentName && user.departmentName.trim() !== ''" class="px-2 py-1 bg-surface-low rounded">
          {{ user.departmentName }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef>ROLE</th>
      <td mat-cell *matCellDef="let user" class="font-medium">{{ user.role | formatEnum }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="!text-center">ACTIONS</th>
      <td mat-cell *matCellDef="let user" class="!text-center">
          <span [matTooltip]="user.role === 'ADMINISTRATOR' && !authService.hasRole('ADMINISTRATOR') ? 'Only administrators can edit other administrators' : 'Edit User'">
              <button mat-icon-button
                      (click)="editUser(user)"
                      [disabled]="user.role === 'ADMINISTRATOR' && !authService.hasRole('ADMINISTRATOR')">
                <mat-icon>edit</mat-icon>
              </button>
          </span>
          <span *ngIf="authService.hasRole('ADMINISTRATOR')" [matTooltip]="user.id === this.authService.getUserId() ? 'Cannot delete yourself' : 'Delete user'">
            <button mat-icon-button color="warn" (click)="deleteUser(user)"
                    [disabled]="user.id === this.authService.getUserId()">
              <mat-icon>delete</mat-icon>
            </button>
          </span>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
