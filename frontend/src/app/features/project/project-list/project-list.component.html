<app-shared-table title="Project Portfolio"
  subtitle="Architecture audit and delivery lifecycle management for Enterprise Tier" entity="projects"
  searchPlaceholder="Search projects..." [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="dataSource.data.length" [loading]="loading" (searchChanged)="applyFilter($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Projects" [value]="dataSource.data.length" />
  </ng-container>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" *appHasRole="['FINANCE_OFFICER', 'ADMINISTRATOR']" [routerLink]="['/projects/create']">
    <mat-icon>add</mat-icon>
    New Project
  </button>

  <!-- Error bar -->
  <ng-container filters>
    <div *ngIf="error" class="bg-red-50 border border-red-200 text-red-700 rounded-[10px] px-4 py-2.5 text-[13px]">
      {{ error }}
    </div>
  </ng-container>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>PROJECT NAME</th>
      <td mat-cell *matCellDef="let project" class="">{{ project.name }}</td>
    </ng-container>

    <ng-container matColumnDef="team">
      <th mat-header-cell *matHeaderCellDef>ASSIGNED TEAM</th>
      <td mat-cell *matCellDef="let project">
        <span class="">
          {{ project.teamName }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="budget">
      <th mat-header-cell *matHeaderCellDef>BUDGET</th>
      <td mat-cell *matCellDef="let project" class="font-semibold">
        {{ project.budget | currency:'EUR':'symbol':'1.0-0' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef>START DATE</th>
      <td mat-cell *matCellDef="let project" class="text-[12px] text-muted-grey">
        {{ project.startDate | date:'MMM d, yyyy' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="endDate">
      <th mat-header-cell *matHeaderCellDef>END DATE</th>
      <td mat-cell *matCellDef="let project" class="text-[12px] text-muted-grey whitespace-nowrap">
        {{ project.endDate | date:'MMM d, yyyy' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let project">
        <div class="flex items-center gap-1">
          <button mat-icon-button (click)="openEditDialog(project)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteProject(project)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
