<app-shared-table title="Project Management"
  subtitle="Configure Projects of Company Teams and set Start and End dates."
  entity="projects" searchPlaceholder="Search..."
  [dataSource]="dataSource" [displayedColumns]="displayedColumns"
  [totalElements]="dataSource.data.length" [loading]="loading"
  (searchChanged)="applyFilter($event)">

  <!-- Stats -->
  <ng-container stats>
    <app-stat-card label="Total Projects" [value]="dataSource.data.length" />
  </ng-container>

  <!-- Actions -->
  <button actions mat-flat-button class="v-btn-brand" *appHasRole="['FINANCE_OFFICER', 'ADMINISTRATOR']" [routerLink]="['/projects/create']">
    <mat-icon>add</mat-icon>
    <span>Add Project</span>
  </button>

  <!-- Error -->
  <div *ngIf="error" filters
       class="bg-red-50 border border-red-200 text-red-700 rounded-lg px-4 py-2 text-sm">
    {{ error }}
  </div>

  <!-- Columns -->
  <ng-container columns>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>PROJECT NAME</th>
      <td mat-cell *matCellDef="let project" class="font-medium">{{ project.name }}</td>
    </ng-container>

    <ng-container matColumnDef="team">
      <th mat-header-cell *matHeaderCellDef>ASSIGNED TEAM</th>
      <td mat-cell *matCellDef="let project">{{ project.teamName }}</td>
    </ng-container>

    <ng-container matColumnDef="budget">
      <th mat-header-cell *matHeaderCellDef>BUDGET</th>
      <td mat-cell *matCellDef="let project" class="font-medium">
        {{ project.budget | currency:'EUR':'symbol':'1.0-0' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="startDate">
      <th mat-header-cell *matHeaderCellDef>START DATE</th>
      <td mat-cell *matCellDef="let project" class="text-sm text-muted-grey">
        {{ project.startDate | date:'MMM d, yyyy' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="endDate">
      <th mat-header-cell *matHeaderCellDef>END DATE</th>
      <td mat-cell *matCellDef="let project" class="text-sm text-muted-grey whitespace-nowrap">
        {{ project.endDate | date:'MMM d, yyyy' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>ACTIONS</th>
      <td mat-cell *matCellDef="let project">
        <div class="flex items-center gap-1">
          <button mat-icon-button matTooltip="Edit Project" (click)="editProject(project)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete Project" (click)="deleteProject(project)">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>
  </ng-container>

</app-shared-table>
