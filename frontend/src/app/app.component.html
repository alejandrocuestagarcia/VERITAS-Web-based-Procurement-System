<div class="bg-surface text-on-surface antialiased min-h-screen">
  <div class="flex min-h-screen w-full">
    <app-sidebar *ngIf="authService.isLoggedIn()"></app-sidebar>

    <main
      class="flex-1 flex flex-col min-w-0"
      [ngClass]="{
        'lg:pl-[260px]': authService.isLoggedIn(),
        'pt-14 lg:pt-0': authService.isLoggedIn()
      }">
      <app-header *ngIf="authService.isLoggedIn()"></app-header>
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
